name: Jarvis synchronization check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-control-plane:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required control files
        shell: bash
        run: |
          set -euo pipefail
          test -f .jarvis/config.yaml
          test -f .jarvis/README.md
          test -f .jarvis/approvals/policy.md
          test -f .jarvis/instructions/operating-contract.md
          grep -q 'provider: github' .jarvis/config.yaml
          grep -q 'approval_required' .jarvis/config.yaml
          # Scan only control-plane text files and exclude this workflow to avoid self-matches.
          if find .jarvis .github -type f \
            \( -name '*.md' -o -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) \
            ! -name 'jarvis-sync.yml' \
            -print0 | xargs -0 grep -InE '(sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{30,}|AKIA[A-Z0-9]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'; then
            echo 'Potential credential detected in control-plane files.'
            exit 1
          fi

      - name: Summarize synchronization scope
        run: |
          echo 'Jarvis source of truth: GitHub'
          echo 'Synchronization trigger: repository change'
          echo 'Automatic: analyze, draft, issue/PR updates, tests'
          echo 'Approval required: deploy, external messages, merge, destructive changes'
