name: Jarvis synchronization check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test credential scanner
        run: python -m unittest discover -s tests -p 'test_control_secret_scan.py' -v

      - name: Validate required control files
        shell: bash
        run: |
          set -euo pipefail
          test -f .jarvis/config.yaml
          test -f .jarvis/README.md
          test -f .jarvis/approvals/policy.md
          test -f .jarvis/instructions/operating-contract.md
          grep -q 'provider: github' .jarvis/config.yaml
          grep -q 'approval_required' .jarvis/config.yaml

      - name: Check control-plane credential patterns
        run: python scripts/check_control_secrets.py

      - name: Summarize synchronization scope
        run: |
          echo 'Jarvis source of truth: GitHub'
          echo 'Synchronization trigger: repository change'
          echo 'Automatic: analyze, draft, issue/PR updates, tests'
          echo 'Approval required: deploy, external messages, merge, destructive changes'
