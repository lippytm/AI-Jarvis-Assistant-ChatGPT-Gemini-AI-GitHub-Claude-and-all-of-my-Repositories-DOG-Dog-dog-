name: jarvis-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jarvis-audit.yml'
      - 'src/jarvis/**'
      - 'tests/**'
      - 'workflows/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.gitignore'
  pull_request:
    paths:
      - '.github/workflows/jarvis-audit.yml'
      - 'src/jarvis/**'
      - 'tests/**'
      - 'workflows/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.gitignore'
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: jarvis-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: install
        run: python -m pip install -e .
      - id: unit_tests
        run: python -m unittest discover -s tests -v 2>&1 | tee unit-tests.log
      - id: validation
        run: python -m jarvis validate-workflows --json | tee workflow-validation.json
      - id: doctor
        run: python -m jarvis doctor --json | tee jarvis-doctor.json
      - id: patrol
        run: python -m jarvis patrol --owner lippytm --json | tee jarvis-patrol.json
        env:
          JARVIS_PATROL_MAX_REPOSITORIES: "250"
          JARVIS_PATROL_STALE_DAYS: "120"
      - id: improve
        run: python -m jarvis improve data/patrol/latest.json --json | tee jarvis-improvement.json
        env:
          JARVIS_LOOP_MAX_OBSERVATIONS: "500"
          JARVIS_LOOP_MAX_PROPOSALS: "50"
          JARVIS_LOOP_MINIMUM_REPEATS: "2"
      - name: Record public audit evidence
        id: evidence
        if: always()
        env:
          PYTHONPATH: src
          JARVIS_AUDIT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m jarvis.audit_evidence create --owner lippytm \
            --step 'checkout=${{ steps.checkout.outcome }}' \
            --step 'python=${{ steps.python.outcome }}' \
            --step 'install=${{ steps.install.outcome }}' \
            --step 'unit_tests=${{ steps.unit_tests.outcome }}' \
            --step 'validation=${{ steps.validation.outcome }}' \
            --step 'doctor=${{ steps.doctor.outcome }}' \
            --step 'patrol=${{ steps.patrol.outcome }}' \
            --step 'improve=${{ steps.improve.outcome }}'
      - name: Verify artifact hashes and MemPalace receipt
        id: verify_evidence
        if: always()
        env:
          PYTHONPATH: src
        run: python -m jarvis.audit_evidence verify --require-success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            unit-tests.log
            workflow-validation.json
            jarvis-doctor.json
            jarvis-patrol.json
            jarvis-improvement.json
            data/patrol/latest.json
            data/improvement/latest.json
            data/improvement/journal.jsonl
            data/audit/manifest.json
            data/audit/anchor.json
            data/audit/mempalace.sqlite3
          retention-days: 30

# Public repository metadata only. PR execution validates its checkout; it does
# not deploy main, inspect every repository's CI, or activate external AI systems.
# No provider credentials, repository writes, merges, or deployments are used.
