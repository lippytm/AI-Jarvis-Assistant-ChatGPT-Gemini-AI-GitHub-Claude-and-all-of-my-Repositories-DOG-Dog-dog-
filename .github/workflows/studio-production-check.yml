name: Studio production check

on:
  push:
    branches: [main]
    paths:
      - 'src/jarvis/**'
      - 'tests/test_studio*.py'
      - 'config/creative-studio.public.json'
      - 'config/prompt-11-profile.json'
      - 'examples/studio-workforce-pilot/**'
      - 'scripts/check_studio_example.py'
      - '.github/workflows/studio-production-check.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'src/jarvis/**'
      - 'tests/test_studio*.py'
      - 'config/creative-studio.public.json'
      - 'config/prompt-11-profile.json'
      - 'examples/studio-workforce-pilot/**'
      - 'scripts/check_studio_example.py'
      - '.github/workflows/studio-production-check.yml'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: studio-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JARVIS_DEFAULT_PROVIDER: mock
      PYTHONDONTWRITEBYTECODE: '1'
      JARVIS_STUDIO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Build and verify the public production example
        run: python scripts/check_studio_example.py --output data/studio-check --require-clean
      - name: Retain the verified public example and scenario evidence
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-studio-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            data/studio-check/packet/
            data/studio-check/build.json
            data/studio-check/verification.json
            data/studio-check/economics-input.json
            data/studio-check/economics-report.json
            data/studio-check/evidence.json
