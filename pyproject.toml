[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-control-tower"
version = "0.1.0"
description = "Auditable multi-provider AI orchestration foundation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC0-1.0"}
authors = [{name = "Charles Earl Lipshay / lippytm.AI"}]
dependencies = []

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
